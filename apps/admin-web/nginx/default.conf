# Unprivileged nginx on :8080. Runtime-generated pieces live in /tmp/runtime (read-only rootfs OK):
#   headers.conf  - security headers incl. CSP built from API_URL
#   config.js     - window.__ADMIN_CONFIG__
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces inherited ones, so headers.conf is included in every location.
    include /tmp/runtime/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        include /tmp/runtime/headers.conf;
        alias /tmp/runtime/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /tmp/runtime/headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html and any other entry: never cached, SPA fallback.
    location / {
        include /tmp/runtime/headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
