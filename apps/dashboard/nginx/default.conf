# Unprivileged nginx on :8080. Runtime-generated pieces live in /tmp/runtime (tmpfs-friendly, read-only rootfs OK):
#   headers.conf  - security headers incl. CSP built from API_URL
#   config.js     - window.__YULONA_CONFIG__
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # NOTE: add_header in a location replaces inherited ones, so headers.conf is included in every location.
    include /tmp/runtime/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        include /tmp/runtime/headers.conf;
        alias /tmp/runtime/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Vite emits content-hashed files under /assets/ -> cache forever.
    location /assets/ {
        include /tmp/runtime/headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Embeddable widget (loaded cross-site by customers' pages via <script src>).
    # Stable name: short cache so a new release reaches sites within minutes. Hashed copy: pin-able + immutable.
    location = /widget.js {
        include /tmp/runtime/headers.conf;
        try_files /widget.js =404;
        default_type application/javascript;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
    }
    location ~ "^/widget\.[0-9a-f]{12}\.js$" {
        include /tmp/runtime/headers.conf;
        try_files $uri =404;
        default_type application/javascript;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same-origin iframe host for the dashboard's live widget preview (own CSP: only this page may be framed by us).
    location = /widget-preview.html {
        include /tmp/runtime/preview-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # index.html and any other entry: never cached, SPA fallback.
    location / {
        include /tmp/runtime/headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
